name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 10 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate
          pnpm --version

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Audit production dependencies
        timeout-minutes: 15
        run: pnpm audit --prod

      - name: Typecheck
        timeout-minutes: 15
        run: pnpm run typecheck

      - name: Build
        timeout-minutes: 15
        run: pnpm run build
